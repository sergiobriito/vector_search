services:
  lb:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    cpus: '0.1'
    mem_limit: 30M
    networks:
      - fraud_network

  api1:
    build: .
    image: fraud-api:latest
    environment:
      - PORT=8080
    cpus: '0.45'
    mem_limit: 160M
    networks:
      - fraud_network

  api2:
    build: .
    image: fraud-api:latest
    environment:
      - PORT=8080
    cpus: '0.45'
    mem_limit: 160M
    networks:
      - fraud_network
    restart: unless-stopped

networks:
  fraud_network:
    driver: bridge