global
    maxconn 5000
    log stdout format raw daemon

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option http-keep-alive

frontend lb
    bind :9999
    default_backend apis

backend apis
    balance roundrobin
    http-reuse always
    server api1 unix@/sockets/api1.sock check maxconn 10000
    server api2 unix@/sockets/api2.sock check maxconn 10000

