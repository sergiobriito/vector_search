global
    maxconn 5000
    log stdout format raw daemon

defaults
    mode http
    timeout connect 10s
    timeout client 60s
    timeout server 60s
    timeout queue 30s
    timeout http-request 10s
    option http-keep-alive

frontend lb
    bind :9999
    default_backend apis

backend apis
    balance roundrobin
    http-reuse aggressive
    timeout server 60s
    timeout tunnel 1h
    server api1 unix@/sockets/api1.sock maxconn 10000
    server api2 unix@/sockets/api2.sock maxconn 10000

